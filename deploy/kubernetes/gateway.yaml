apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentid-gateway
  namespace: agentid
  labels:
    app.kubernetes.io/name: agentid
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentid
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentid
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: ghcr.io/example/agentid:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - agentid.gateway.main:app
            - --host=0.0.0.0
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentid-config
            - secretRef:
                name: agentid-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentid-gateway
  namespace: agentid
spec:
  selector:
    app.kubernetes.io/name: agentid
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
