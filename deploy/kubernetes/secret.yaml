# Placeholder only. In a real cluster these come from a secrets manager
# (External Secrets, Vault Agent, SOPS) — never from a file in git.
apiVersion: v1
kind: Secret
metadata:
  name: agentid-secrets
  namespace: agentid
type: Opaque
stringData:
  AGENTID_SECRET_KEY: "replace-me-with-a-32-byte-random-value"
  AGENTID_CREDENTIAL_ENCRYPTION_KEY: "replace-me-with-a-different-32-byte-value"
  AGENTID_DATABASE_URL: "postgresql+psycopg://agentid:replace-me@postgres:5432/agentid"
