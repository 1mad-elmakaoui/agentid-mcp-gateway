# Downstream MCP servers accept traffic from the gateway only. Even with a valid
# credential, nothing else in the cluster can reach them directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-gateway-only
  namespace: agentid
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["github-mcp", "postgres-mcp", "kubernetes-mcp"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
