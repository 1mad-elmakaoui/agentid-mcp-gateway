# The example MCP servers. Each verifies gateway-issued credentials for its own
# audience and nothing else, so a token minted for one will not work at another.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: agentid
  labels:
    app.kubernetes.io/name: agentid
    app.kubernetes.io/component: github-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: github-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentid
        app.kubernetes.io/component: github-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: server
          image: ghcr.io/example/agentid:0.1.0
          args:
            - uvicorn
            - agentid.servers.github.server:app
            - --host=0.0.0.0
            - --port=8001
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: AGENTID_SERVER_AUDIENCE
              value: "agentid-mcp:github"
          envFrom:
            - secretRef:
                name: agentid-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  namespace: agentid
spec:
  selector:
    app.kubernetes.io/component: github-mcp
  ports:
    - name: http
      port: 8001
      targetPort: http
---
